# CodeRabbit configuration — https://docs.coderabbit.ai/guides/configure-coderabbit
# Requires the CodeRabbit GitHub App to be installed on this repository.

language: zh-CN
tone_instructions: >-
  请以简洁、务实的语气进行中文评审。重点关注正确性、线程/异步安全、
  WinUI 生命周期问题以及 Go 桥接层的错误处理，避免吹毛求疵的风格意见。
early_access: false
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - WIP
      - DRAFT
    drafts: false
    base_branches:
      - main
  path_filters:
    # 构建产物与缓存
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/artifacts/**"
    - "!**/.cache/**"
    # 本地固定版本的上游源码（由 scripts 拉取，不入库评审）
    - "!upstream/sing-box/**"
    - "!upstream/sing-lib/**"
    - "!upstream/sing-box-for-apple/**"
    - "!upstream/sing-box-for-android/**"
    # 自动生成代码
    - "!**/*.designer.cs"
    - "!**/*.g.cs"
    - "!**/*.g.i.cs"
  path_instructions:
    - path: "**/*.xaml"
      instructions: >-
        检查绑定路径是否与 ViewModel 属性匹配、x:Bind 模式（OneWay/TwoWay）
        是否合理，以及资源字典引用是否存在。
    - path: "Services/**/*.cs"
      instructions: >-
        重点关注异步取消令牌传递、DispatcherQueue 线程切换、
        gRPC 流的生命周期与异常处理。
    - path: "NativeBridge/**/*.go"
      instructions: >-
        关注错误是否被忽略、goroutine 泄漏、以及 gRPC 服务关闭时的资源释放。

chat:
  auto_reply: true
