name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Build WinUI app (x64)
    runs-on: windows-latest
    env:
      GOCACHE: ${{ github.workspace }}\.cache\gocache
      GOMODCACHE: ${{ github.workspace }}\.cache\gomod
      GOPATH: ${{ github.workspace }}\.cache\gopath
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Release tags distribute an MSIX package, which Windows only installs when
      # it is signed. Import the development signing certificate from the
      # repository secrets before anything is built, so the daemon, the app and
      # the package all carry the same signer on this runner.
      - name: Import release signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SFW_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.SFW_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { throw 'Secret SFW_SIGNING_PFX is not set: the release signing certificate is missing.' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sfw-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $password = if ($env:PFX_PASSWORD) {
              ConvertTo-SecureString -String $env:PFX_PASSWORD -AsPlainText -Force
            } else { [Security.SecureString]::new() }
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force
          }

          # Sign-Outputs.ps1 selects the certificate by the manifest publisher
          # and creates a fresh self-signed one when nothing matches. Fail here
          # instead, so a missing or mismatched secret cannot produce a release
          # signed by a different certificate than the one imported above.
          $publisher = ([xml](Get-Content Package.appxmanifest -Raw)).Package.Identity.Publisher
          . ./Scripts/SigningCertificate.ps1
          $cert = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Subject -eq $publisher -and $_.HasPrivateKey } |
            Sort-Object NotAfter -Descending |
            Select-Object -First 1
          if (-not $cert) { throw "No signing certificate for publisher '$publisher' was imported." }
          Assert-SfwSigningCertificate -Certificate $cert
          "SFW_SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Signing certificate: $($cert.Thumbprint), expires $($cert.NotAfter)"

      # boxdd is required: the app build fails without daemon\sing-box-daemon.exe.
      # .cache/upstream is gitignored, so fetch the pinned sing-box sources in CI.
      - name: Read pinned sing-box revision
        id: pins
        shell: pwsh
        run: |
          $lock = Get-Content Scripts/sources.lock.json -Raw | ConvertFrom-Json
          "singbox=$($lock.singbox.Commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "go=$($lock.toolchain.go -replace '^go', '')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout sing-box (pinned)
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.pins.outputs.singbox }}
          path: .cache/upstream/sing-box
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.pins.outputs.go }}
          # Match build-daemon.ps1 so the restored compiler cache is actually used.
          cache: true
          cache-dependency-path: |
            .cache/upstream/sing-box/go.sum
            Scripts/sources.lock.json
            Scripts/build-daemon.ps1
            Scripts/daemon-patches/*.patch

      - name: Build boxdd daemon
        shell: pwsh
        run: |
          ./Scripts/build-daemon.ps1 -SingBoxSource ./.cache/upstream/sing-box
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tags = (Get-Content .cache/upstream/sing-box/release/DEFAULT_BUILD_TAGS_WINDOWS -Raw).Trim()
          $linkFlags = (Get-Content .cache/upstream/sing-box/release/LDFLAGS -Raw).Trim()
          go -C .cache/upstream/sing-box test -tags $tags -ldflags $linkFlags ./experimental/clashmode ./common/listener ./experimental/boxdd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SFW.csproj -p:Configuration=Release -p:Platform=x64 -r win-x64

      - name: Run xUnit unit and signed-worker integration tests
        shell: pwsh
        run: |
          dotnet build Tests/SFW.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # boxdd authenticates the test host by executable name and signer, so the
          # signed-worker test only runs when the host has the app certificate.
          ./Scripts/Sign-Outputs.ps1 -Paths Tests/bin/Release/net10.0/sing-box.exe
          $env:SFW_INTEGRATION = "1"
          ./Tests/bin/Release/net10.0/sing-box.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish ReadyToRun release
        run: dotnet publish SFW.csproj -c Release -p:Platform=x64 -r win-x64 --no-restore --output artifacts/release

      - name: Verify published native code and resources
        shell: pwsh
        run: |
          $stream = [IO.File]::OpenRead((Join-Path $PWD 'artifacts/release/sing-box.dll'))
          try {
            $pe = [System.Reflection.PortableExecutable.PEReader]::new($stream)
            if ($pe.PEHeaders.CorHeader.ManagedNativeHeaderDirectory.Size -eq 0) { throw 'ReadyToRun code is missing.' }
            $pe.Dispose()
          } finally { $stream.Dispose() }
          foreach ($path in @('Assets/AppIcon.ico', 'resources/daemon/sing-box-daemon.exe', 'resources/daemon/WinDivert64.sys')) {
            if (-not (Test-Path (Join-Path 'artifacts/release' $path))) { throw "Missing publish resource: $path" }
          }

      # Tag builds reuse the local release entry point: it packs the signed
      # sideload MSIX with its offline dependencies, installer scripts and
      # public certificate, verifies the result, and writes the ZIP checksum.
      - name: Package sideload release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./Scripts/Build.ps1 -SkipDaemonBuild -OutputDirectory artifacts/bundle

      # Bind the published bundle to the imported certificate: the exported
      # public certificate must be the one whose private key signed the build.
      - name: Verify release certificate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not $env:SFW_SIGNING_THUMBPRINT) { throw 'The imported signing certificate was not recorded.' }
          $exported = @(Get-ChildItem artifacts/bundle -Recurse -Filter 'SFW_Developer.cer')
          if ($exported.Count -ne 1) { throw "Expected one exported certificate; found $($exported.Count)." }
          $thumbprint = [Security.Cryptography.X509Certificates.X509Certificate2]::new($exported[0].FullName).Thumbprint
          if ($thumbprint -ne $env:SFW_SIGNING_THUMBPRINT) {
            throw "Release was signed by $thumbprint, not by the imported certificate $env:SFW_SIGNING_THUMBPRINT."
          }
          Write-Host "Release certificate verified: $thumbprint"

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: sfw-release
          path: |
            artifacts/bundle/**/SFW_*.zip
            artifacts/bundle/**/SFW_*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: sfw-release
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(find dist -name '*.zip' -print -quit)
          sha=$(find dist -name '*.zip.sha256' -print -quit)
          args=(--title "SFW $GITHUB_REF_NAME" --generate-notes --latest)
          case "$GITHUB_REF_NAME" in
            *-*) args=(--title "SFW $GITHUB_REF_NAME" --generate-notes --prerelease --latest=false) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$zip" "$sha" \
            --repo "$GITHUB_REPOSITORY" "${args[@]}"
