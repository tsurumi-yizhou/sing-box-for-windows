name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Build WinUI app (x64)
    runs-on: windows-latest
    env:
      GOCACHE: ${{ github.workspace }}\.cache\gocache
      GOMODCACHE: ${{ github.workspace }}\.cache\gomod
      GOPATH: ${{ github.workspace }}\.cache\gopath
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # boxdd is required: the app build fails without daemon\sing-box-daemon.exe.
      # .cache/upstream is gitignored, so fetch the pinned sing-box sources in CI.
      - name: Read pinned sing-box revision
        id: pins
        shell: pwsh
        run: |
          $lock = Get-Content Scripts/sources.lock.json -Raw | ConvertFrom-Json
          "singbox=$($lock.singbox.Commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "go=$($lock.toolchain.go -replace '^go', '')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout sing-box (pinned)
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.pins.outputs.singbox }}
          path: .cache/upstream/sing-box
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.pins.outputs.go }}
          # Match build-daemon.ps1 so the restored compiler cache is actually used.
          cache: true
          cache-dependency-path: |
            .cache/upstream/sing-box/go.sum
            Scripts/sources.lock.json
            Scripts/build-daemon.ps1
            Scripts/daemon-patches/*.patch

      - name: Build boxdd daemon
        shell: pwsh
        run: |
          ./Scripts/build-daemon.ps1 -SingBoxSource ./.cache/upstream/sing-box
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tags = (Get-Content .cache/upstream/sing-box/release/DEFAULT_BUILD_TAGS_WINDOWS -Raw).Trim()
          $linkFlags = (Get-Content .cache/upstream/sing-box/release/LDFLAGS -Raw).Trim()
          go -C .cache/upstream/sing-box test -tags $tags -ldflags $linkFlags ./experimental/clashmode ./common/listener ./experimental/boxdd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SFW.csproj -p:Configuration=Release -p:Platform=x64 -r win-x64

      - name: Test subscription recovery and atomic writes
        shell: pwsh
        run: |
          dotnet build Tests/SFW.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Scripts/Sign-Outputs.ps1 -Paths Tests/bin/Release/net10.0/sing-box.exe
          ./Tests/bin/Release/net10.0/sing-box.exe --integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish ReadyToRun release
        run: dotnet publish SFW.csproj -c Release -p:Platform=x64 -r win-x64 --no-restore --output artifacts/release

      - name: Verify published native code and resources
        shell: pwsh
        run: |
          $stream = [IO.File]::OpenRead((Join-Path $PWD 'artifacts/release/sing-box.dll'))
          try {
            $pe = [System.Reflection.PortableExecutable.PEReader]::new($stream)
            if ($pe.PEHeaders.CorHeader.ManagedNativeHeaderDirectory.Size -eq 0) { throw 'ReadyToRun code is missing.' }
            $pe.Dispose()
          } finally { $stream.Dispose() }
          foreach ($path in @('Assets/AppIcon.ico', 'resources/daemon/sing-box-daemon.exe', 'resources/daemon/WinDivert64.sys')) {
            if (-not (Test-Path (Join-Path 'artifacts/release' $path))) { throw "Missing publish resource: $path" }
          }
